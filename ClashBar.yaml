port: 0
socks-port: 0
redir-port: 0
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
find-process-mode: always
keep-alive-interval: 15
keep-alive-idle: 600

geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.push.apple.com'

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - rule-set:Direct
    - rule-set:Download
    - rule-set:Lan
    - rule-set:TencentVideo
    - rule-set:China
    - '*.lan'
    - '*.local'
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com

BaseDomain: &BaseDomain { type: http, behavior: domain, interval: 86400 }
BaseClassical:
  &BaseClassical { type: http, behavior: classical, interval: 86400 }

BaseSelect:
  &BaseSelect {
    type: select,
    proxies:
      [
        ♻️ 自动选择,
        🚀 手动切换,
        🇭🇰 香港节点,
        🇨🇳 台湾节点,
        🇺🇸 美国节点,
        🇯🇵 日本节点,
        🇸🇬 狮城节点,
        🇪🇺 欧洲节点,
        DIRECT,
      ],
    interval: 300,
  }

BaseGroupSelect:
  &BaseGroupSelect {
    type: select,
    proxies:
      [
        ♻️ 自动选择,
        🚀 手动切换,
        🧩 分组选择,
        🇭🇰 香港节点,
        🇨🇳 台湾节点,
        🇺🇸 美国节点,
        🇯🇵 日本节点,
        🇸🇬 狮城节点,
        🇪🇺 欧洲节点,
        DIRECT,
      ],
    interval: 300,
  }
BaseAI:
  &BaseAI {
    type: select,
    proxies: [🇺🇸 美国节点, 🇪🇺 欧洲节点, 🇯🇵 日本节点],
    interval: 300,
  }

BaseREJECT: &BaseReject { type: select, proxies: [REJECT], interval: 300 }
BaseProvider:
  &BaseProvider {
    type: http,
    interval: 3600,
    health-check:
      {
        enable: true,
        url: http://wifi.vivo.com.cn/generate_204,
        interval: 300,
      },
  }
BaseUrlTest:
  &BaseUrlTest {
    type: url-test,
    lazy: true,
    hidden: true,
    url: https://cp.cloudflare.com/generate_204,
    interval: 300,
    timeout: 3000,
    tolerance: 100,
    use: [proxy],
  }

BaseSelectProxy: &BaseSelectProxy { type: select, use: [proxy] }

proxy-providers:
  proxy:
    <<: *BaseProvider
    url:
    path: ./proxy/proxy.yaml

proxy-groups:
  - { name: 🆎 广告拦截, <<: *BaseReject }
  - { name: 🚀 手动切换, <<: *BaseSelectProxy }
  - { name: 🍎 苹果服务, <<: *BaseGroupSelect }
  - { name: 🧩 分组选择, <<: *BaseSelect }
  - { name: 🤖 人工智能, <<: *BaseAI }
  - { name: ✨ Gemini, <<: *BaseAI }
  - { name: 🧠 Claude, <<: *BaseAI }
  - { name: 👨🏻‍💻 GitHub, <<: *BaseGroupSelect }
  - { name: ☁️ Cloudflare, <<: *BaseGroupSelect }
  - { name: 🌌 谷歌服务, <<: *BaseGroupSelect }
  - { name: Ⓜ️ 微软服务, <<: *BaseGroupSelect }
  - { name: 📟 国外社交, <<: *BaseGroupSelect }
  - { name: 🎥 国外视频, <<: *BaseGroupSelect }
  - { name: 🐟 漏网之鱼, <<: *BaseGroupSelect }

  - { name: ♻️ 自动选择, <<: *BaseUrlTest }
  - { name: 🇭🇰 香港节点, <<: *BaseUrlTest, filter: '🇭🇰|HK|香港' }
  - { name: 🇨🇳 台湾节点, <<: *BaseUrlTest, filter: '🇨🇳|TW|台湾' }
  - { name: 🇺🇸 美国节点, <<: *BaseUrlTest, filter: '🇺🇸|US|美国' }
  - { name: 🇯🇵 日本节点, <<: *BaseUrlTest, filter: '🇯🇵|JP|日本' }
  - { name: 🇸🇬 狮城节点, <<: *BaseUrlTest, filter: '🇸🇬|SG|新加' }
  - {
      name: 🇪🇺 欧洲节点,
      <<: *BaseUrlTest,
      filter: '🇫🇷|FR|法国|🇩🇪|DE|德国|🇬🇧|UK|英国',
    }

